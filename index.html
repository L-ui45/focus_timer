<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄专注钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">🌙 深色</button>

  <div id="timer" aria-live="polite">25:00</div>

  <div class="controls">
    <button id="startBtn">开始</button>
    <button id="resetBtn" class="secondary">重置</button>
    <button id="stopBtn" class="secondary">停止</button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
